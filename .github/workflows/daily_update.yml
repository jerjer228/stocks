name: Daily PM Dashboard Update

on:
  schedule:
    # 00:00 UTC = 08:00 HKT (每日香港時間早上 8 點自動執行)
    - cron: '0 0 * * *'
  workflow_dispatch: # 支援在 GitHub 介面上手動點擊按鈕隨時觸發

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Fetch Script
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python update_dashboard.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update dashboard data [HKT 08:00]" && git push)

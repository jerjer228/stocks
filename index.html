<!DOCTYPE html>
<html lang="zh-HK" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PM Capital Allocation Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #0b0f17; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  </style>
</head>
<body class="p-4 md:p-8 max-w-7xl mx-auto">
  
  <!-- Header & Search Bar -->
    <!-- Header & Search Bar -->
  <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 pb-4 border-b border-gray-800">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-white flex items-center gap-2">
        <i data-lucide="shield-alert" class="text-blue-500"></i> PM Capital Allocation Dashboard
      </h1>
      <p class="text-xs text-gray-400 mt-1">自動化板塊輪動與量化資金配置系統</p>
    </div>

    <!-- Search Section -->
    <div class="flex items-center gap-2 w-full md:w-auto">
      <div class="relative w-full md:w-64">
        <input id="search-input" type="text" placeholder="輸入美股代號 (如 TSLA)..." class="w-full bg-gray-900 border border-gray-700 text-white text-sm rounded-lg pl-9 pr-3 py-2 focus:outline-none focus:border-blue-500 uppercase">
        <i data-lucide="search" class="w-4 h-4 text-gray-500 absolute left-3 top-2.5"></i>
      </div>
      <button onclick="searchStock()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition whitespace-nowrap">
        搜尋
      </button>
    </div>

    <!-- Market Session & Last Updated -->
    <div class="text-right flex items-center gap-2">
      <span id="market-session-badge" class="px-2 py-0.5 text-xs font-bold rounded bg-gray-800 text-gray-400 border border-gray-700">
        載入中...
      </span>
      <div>
        <span class="text-xs text-gray-500">最後更新 (HKT)</span>
        <div id="last-updated" class="text-sm font-mono text-gray-300">--:--:--</div>
      </div>
    </div>
  </header>


  <!-- Search Result Card (Default Hidden) -->
  <div id="search-result-box" class="hidden mb-6 bg-gray-900 border border-blue-500/50 rounded-xl p-5 shadow-2xl relative">
    <button onclick="closeSearchResult()" class="absolute top-4 right-4 text-gray-400 hover:text-white">
      <i data-lucide="x" class="w-5 h-5"></i>
    </button>
    <h3 class="text-xs font-bold text-blue-400 uppercase tracking-wider mb-2 flex items-center gap-1.5">
      <i data-lucide="sparkles" class="w-4 h-4"></i> 實時個股量化分析結果
    </h3>
    <div id="search-result-content" class="grid grid-cols-1 md:grid-cols-4 gap-4 mt-3">
      <!-- Search result will render here -->
    </div>
  </div>

  <!-- Main 4-Card Grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
    
    <!-- Card 1: Market Regime & Capital Confidence -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg relative overflow-hidden">
      <div class="flex justify-between items-start mb-4">
        <h2 class="text-sm font-semibold text-gray-400 tracking-wider uppercase flex items-center gap-2">
          <i data-lucide="activity" class="w-4 h-4 text-emerald-400"></i> 1. 市場總體 & 信心指數
        </h2>
        <span id="allocation-badge" class="px-2.5 py-1 text-xs font-bold rounded-full bg-gray-800 text-gray-300">計算中...</span>
      </div>
      
      <div class="flex items-baseline gap-4 my-2">
        <div id="confidence-score" class="text-5xl font-black text-white">--</div>
        <div class="text-xs text-gray-400">
          / 100 分<br>
          <span id="regime-status" class="text-sm font-semibold text-gray-200">--</span>
        </div>
      </div>

      <div class="w-full bg-gray-800 h-2 rounded-full my-4 overflow-hidden">
        <div id="confidence-bar" class="bg-blue-500 h-full transition-all duration-500" style="width: 0%"></div>
      </div>

      <div class="grid grid-cols-3 gap-2 text-center text-xs mt-4 pt-3 border-t border-gray-800/60">
        <div class="bg-gray-950/50 p-2 rounded">
          <div class="text-gray-500">SPY 狀態</div>
          <div id="spy-status" class="font-mono font-medium text-gray-300 mt-0.5">--</div>
        </div>
        <div class="bg-gray-950/50 p-2 rounded">
          <div class="text-gray-500">QQQ 狀態</div>
          <div id="qqq-status" class="font-mono font-medium text-gray-300 mt-0.5">--</div>
        </div>
        <div class="bg-gray-950/50 p-2 rounded">
          <div class="text-gray-500">VIX 指數</div>
          <div id="vix-value" class="font-mono font-medium text-gray-300 mt-0.5">--</div>
        </div>
      </div>
    </div>

    <!-- Card 2: Tonight's Trades -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg">
      <h2 class="text-sm font-semibold text-gray-400 tracking-wider uppercase mb-4 flex items-center gap-2">
        <i data-lucide="zap" class="w-4 h-4 text-amber-400"></i> 2. 今晚交易部署
      </h2>
      <div id="tonight-trades" class="space-y-2.5 text-sm">
        <div class="text-gray-500 text-xs">加載中...</div>
      </div>
    </div>

    <!-- Card 3: Long-term Core Selection -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg">
      <h2 class="text-sm font-semibold text-gray-400 tracking-wider uppercase mb-4 flex items-center gap-2">
        <i data-lucide="trending-up" class="w-4 h-4 text-blue-400"></i> 3. 長線首選池
      </h2>
      <div id="long-term-picks" class="space-y-2.5 text-sm">
        <div class="text-gray-500 text-xs">加載中...</div>
      </div>
    </div>

    <!-- Card 4: Avoid / Risk Alerts -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 shadow-lg">
      <h2 class="text-sm font-semibold text-gray-400 tracking-wider uppercase mb-4 flex items-center gap-2">
        <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-400"></i> 4. 避免交易 / 風險警告
      </h2>
      <div id="avoid-list" class="space-y-2.5 text-sm">
        <div class="text-gray-500 text-xs">加載中...</div>
      </div>
    </div>

  </div>

  <!-- Bottom Banner: Actionable Conclusion -->
  <div id="action-banner" class="bg-blue-950/40 border border-blue-800/60 rounded-xl p-5 shadow-xl flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
    <div class="flex items-start gap-3">
      <div class="p-2 bg-blue-500/10 rounded-lg text-blue-400 mt-0.5">
        <i data-lucide="compass" class="w-6 h-6"></i>
      </div>
      <div>
        <h3 class="text-xs uppercase tracking-wider text-blue-400 font-bold">底部行動結論 (Action Conclusion)</h3>
        <p id="action-summary" class="text-base font-semibold text-white mt-0.5">正在計算市場數據與配置指令...</p>
      </div>
    </div>
    <div id="action-directive" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-bold text-sm whitespace-nowrap">
      等待指令
    </div>
  </div>

  <script>
    // 填入你的 Finnhub API Key 供前端實時搜尋使用
    const FINNHUB_KEY = "d9u2klhr01qujo6n21tgd9u2klhr01qujo6n21u0";

      <script>
    async function loadData() {
      try {
        const res = await fetch('data.json?t=' + Date.now());
        const data = await res.json();

        // 0. 渲染更新時間與市場時段 (盤前 / 盤中 / 盤後 / 休市)
        if (data.last_updated) {
          document.getElementById('last-updated').innerText = data.last_updated;
        }

        const sessionBadge = document.getElementById('market-session-badge');
        if (sessionBadge && data.market && data.market.session) {
          sessionBadge.innerText = data.market.session;
          if (data.market.session.includes('盤前') || data.market.session.includes('盤後')) {
            sessionBadge.className = "px-2 py-0.5 text-xs font-bold rounded bg-amber-900/50 text-amber-300 border border-amber-700/50 mr-2";
          } else if (data.market.session.includes('盤中')) {
            sessionBadge.className = "px-2 py-0.5 text-xs font-bold rounded bg-emerald-900/50 text-emerald-300 border border-emerald-700/50 mr-2";
          } else {
            sessionBadge.className = "px-2 py-0.5 text-xs font-bold rounded bg-gray-800 text-gray-400 border border-gray-700 mr-2";
          }
        }

        // 1. Render Card 1 (Confidence & Market)
        const score = data.market.confidence_score;
        document.getElementById('confidence-score').innerText = score;
        document.getElementById('confidence-bar').style.width = score + '%';
        document.getElementById('spy-status').innerText = data.market.spy_status;
        document.getElementById('qqq-status').innerText = data.market.qqq_status;
        document.getElementById('vix-value').innerText = data.market.vix_val;

        const badge = document.getElementById('allocation-badge');
        const summary = document.getElementById('action-summary');
        const directive = document.getElementById('action-directive');
        const regimeStatus = document.getElementById('regime-status');

        if (score > 75) {
          badge.className = "px-2.5 py-1 text-xs font-bold rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
          badge.innerText = "全倉執行 (>75)";
          regimeStatus.innerText = "牛市多頭輪動良好";
          summary.innerText = "市場結構極佳，各板塊輪動正常。建議執行全倉/高 Conviction 策略部署。";
          directive.className = "px-4 py-2 rounded-lg bg-emerald-600 text-white font-bold text-sm";
          directive.innerText = "建議持倉：100% 全倉";
        } else if (score >= 60) {
          badge.className = "px-2.5 py-1 text-xs font-bold rounded-full bg-amber-500/20 text-amber-400 border border-amber-500/30";
          badge.innerText = "選擇性部署 25-50% (60-75)";
          regimeStatus.innerText = "震盪中性 / 擇優進場";
          summary.innerText = "市場趨勢分化或波動上升。僅選擇最高 Conviction 標的，總倉位控制在 25-50% 之間。";
          directive.className = "px-4 py-2 rounded-lg bg-amber-600 text-white font-bold text-sm";
          directive.innerText = "建議持倉：25% - 50%";
        } else {
          badge.className = "px-2.5 py-1 text-xs font-bold rounded-full bg-rose-500/20 text-rose-400 border border-rose-500/30";
          badge.innerText = "空倉 / 防禦策略 (<60)";
          regimeStatus.innerText = "高風險 / 破位下跌";
          summary.innerText = "市場環境劣勢，VIX 或板塊破位指標觸發。停止新建立長頭寸，保持空倉或嚴格避險。";
          directive.className = "px-4 py-2 rounded-lg bg-rose-600 text-white font-bold text-sm";
          directive.innerText = "建議持倉：0% (空倉避險)";
        }

        // 2. Render Card 2
        document.getElementById('tonight-trades').innerHTML = data.tonight_trades.map(t => `
          <div class="flex justify-between items-center p-2.5 bg-gray-950/60 rounded border border-gray-800/80">
            <div>
              <span class="font-bold text-white mr-2">${t.ticker}</span>
              <span class="text-xs text-gray-400">${t.strategy}</span>
            </div>
            <span class="text-xs font-mono bg-blue-900/40 text-blue-300 px-2 py-0.5 rounded border border-blue-700/30">Conviction ${t.conviction}</span>
          </div>
        `).join('');

        // 3. Render Card 3
        document.getElementById('long-term-picks').innerHTML = data.long_term_picks.map(p => `
          <div class="flex justify-between items-center p-2.5 bg-gray-950/60 rounded border border-gray-800/80">
            <div>
              <span class="font-bold text-emerald-400 mr-2">${p.ticker}</span>
              <span class="text-xs text-gray-400">${p.reason}</span>
            </div>
            <span class="text-xs font-mono text-gray-300">${p.score}分</span>
          </div>
        `).join('');

        // 4. Render Card 4
        document.getElementById('avoid-list').innerHTML = data.avoid_list.map(a => `
          <div class="flex justify-between items-center p-2.5 bg-gray-950/60 rounded border border-gray-800/80">
            <div>
              <span class="font-bold text-rose-400 mr-2">${a.ticker}</span>
              <span class="text-xs text-gray-400">${a.reason}</span>
            </div>
            <span class="text-xs font-mono text-rose-300/80 bg-rose-950/40 px-2 py-0.5 rounded">${a.risk_level}</span>
          </div>
        `).join('');

        lucide.createIcons();
      } catch (err) {
        console.error("載入數據失敗:", err);
      }
    }

    // 免 API Key 的 Yahoo Finance 前端即時搜尋邏輯
    async function searchStock() {
      const input = document.getElementById('search-input').value.trim().toUpperCase();
      if (!input) return;

      const resultBox = document.getElementById('search-result-box');
      const resultContent = document.getElementById('search-result-content');
      
      resultBox.classList.remove('hidden');
      resultContent.innerHTML = `<div class="col-span-4 text-gray-400 text-sm">搜尋中: ${input}...</div>`;

      try {
        const res = await fetch(`https://query1.finance.yahoo.com/v8/finance/chart/${input}?interval=1d`);
        const data = await res.json();

        const meta = data.chart.result[0].meta;
        const currentPrice = meta.regularMarketPrice;
        const previousClose = meta.chartPreviousClose;
        const changePercent = ((currentPrice - previousClose) / previousClose) * 100;

        let conviction = 50;
        let strategy = "區間盤整 / Covered Call";
        let colorClass = "text-amber-400";

        if (changePercent > 1.5) {
          conviction = 85;
          strategy = "動量突破 / 買入 Call Option";
          colorClass = "text-emerald-400";
        } else if (changePercent < -1.5) {
          conviction = 20;
          strategy = "技術破位 / 觀望或 Put 避險";
          colorClass = "text-rose-400";
        }

        resultContent.innerHTML = `
          <div class="bg-gray-950/60 p-3 rounded-lg border border-gray-800">
            <div class="text-xs text-gray-500">標的 / 現價</div>
            <div class="text-lg font-bold text-white mt-1">${input} <span class="text-sm font-mono text-gray-300">$${currentPrice.toFixed(2)}</span></div>
          </div>
          <div class="bg-gray-950/60 p-3 rounded-lg border border-gray-800">
            <div class="text-xs text-gray-500">單日漲跌幅</div>
            <div class="text-lg font-bold ${changePercent >= 0 ? 'text-emerald-400' : 'text-rose-400'} mt-1">${changePercent >= 0 ? '+' : ''}${changePercent.toFixed(2)}%</div>
          </div>
          <div class="bg-gray-950/60 p-3 rounded-lg border border-gray-800">
            <div class="text-xs text-gray-500">Conviction 分數</div>
            <div class="text-lg font-bold ${colorClass} mt-1">${conviction} / 100</div>
          </div>
          <div class="bg-gray-950/60 p-3 rounded-lg border border-gray-800">
            <div class="text-xs text-gray-500">建議策略</div>
            <div class="text-sm font-semibold text-gray-200 mt-1">${strategy}</div>
          </div>
        `;

        lucide.createIcons();
      } catch (err) {
        resultContent.innerHTML = `<div class="col-span-4 text-rose-400 text-sm">搜尋失敗，請確認標的代號是否正確 (如 TSLA, NVDA)。</div>`;
      }
    }

    function closeSearchResult() {
      document.getElementById('search-result-box').classList.add('hidden');
    }

    // 鍵盤按下 Enter 鍵觸發搜尋
    document.getElementById('search-input').addEventListener('keypress', function (e) {
      if (e.key === 'Enter') {
        searchStock();
      }
    });

    // 初始化頁面數據
    loadData();
  </script>
